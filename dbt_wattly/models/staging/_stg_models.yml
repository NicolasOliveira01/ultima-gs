version: 2

models:
  - name: stg_leituras
    description: Leituras dos carregadores com tipos corretos e sem duplicidade.
    columns:
      - name: id_leitura
        description: Identificador único da leitura.
        data_tests: [unique, not_null]
      - name: id_sessao
        data_tests: [not_null]
      - name: data_hora
        data_tests: [not_null]

  - name: stg_carregadores
    description: Cadastro dos carregadores com tipos corretos e sem duplicidade.
    columns:
      - name: id_carregador
        description: Identificador único do carregador.
        data_tests: [unique, not_null]
