version: 2

models:
  - name: dim_carregador
    description: Dimensão de carregadores (bairro, dono, tarifa, potência e localização).
    columns:
      - name: id_carregador
        data_tests: [unique, not_null]

  - name: dim_data
    description: Calendário diário entre a primeira e a última leitura.
    columns:
      - name: data
        data_tests: [unique, not_null]

  - name: fato_sessoes
    description: Uma linha por sessão de carga. Use para receita, ticket médio, duração e pausas.
    columns:
      - name: id_sessao
        data_tests: [unique, not_null]
      - name: id_carregador
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_carregador')
              field: id_carregador
      - name: data
        data_tests:
          - relationships:
              to: ref('dim_data')
              field: data

  - name: fato_leituras
    description: Uma linha por leitura. Use para temperatura e estado ao longo do tempo.
    columns:
      - name: id_leitura
        data_tests: [unique, not_null]
      - name: id_sessao
        data_tests:
          - relationships:
              to: ref('fato_sessoes')
              field: id_sessao
      - name: id_carregador
        data_tests:
          - relationships:
              to: ref('dim_carregador')
              field: id_carregador
