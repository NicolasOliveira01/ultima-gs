version: 2

models:
  - name: int_sessoes
    description: Uma linha por sessão de carga, agregada a partir das leituras.
    columns:
      - name: id_sessao
        description: Identificador único da sessão de carga.
        data_tests: [unique, not_null]
      - name: id_carregador
        data_tests: [not_null]
      - name: duracao_min
        description: Duração da carga em minutos simulados.
      - name: valor_pago_brl
        description: Valor pago pela sessão (contado uma única vez).
      - name: minutos_normal
        description: Minutos da carga em NORMAL.
      - name: minutos_reduzido
        description: Minutos da carga em REDUZIDO (potência a 50%).
      - name: minutos_pausado
        description: Minutos da carga em PAUSADO (superaquecimento).
      - name: qtd_pausas
        description: Quantas vezes a carga entrou em PAUSADO.
      - name: kwh_excedente
        description: Energia entregue além da paga (somente em cargas concluídas).
      - name: pct_tempo_alerta
        description: Fração do tempo em REDUZIDO ou PAUSADO (0 a 1).
      - name: status_sessao
        description: CONCLUIDA ou EM_ANDAMENTO.
