name: 'dbt_ultima_gs'
version: '1.0.0'
profile: 'dbt_ultima_gs'

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  pasta_dados: "../csv"   # pasta dos CSVs, relativa à pasta do projeto dbt
  aceleracao: 360         # 1 s real = 6 min de carga simulados (igual ao Arduino)

models:
  dbt_ultima_gs:
    staging:              # camada STG: dado limpo e tipado
      +schema: stg
      +materialized: view
    intermediate:         # camada INT: regras de negócio
      +schema: int
      +materialized: view
    final:                # camada FINAL: tabelas para o Power BI
      +schema: final
      +materialized: table
